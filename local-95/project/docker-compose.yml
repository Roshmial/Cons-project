services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    environment:
      HERMES_WEB_BACKEND_HOST: 0.0.0.0
      HERMES_WEB_BACKEND_PORT: 8791
      HERMES_WEB_CORS_ALLOW_ORIGIN: http://127.0.0.1:8793
      HERMES_WEB_MODE: hermes-api
      HERMES_WEB_HERMES_API_BASE_URL: http://host.docker.internal:8642/v1
      HERMES_WEB_HERMES_API_KEY: ${API_SERVER_KEY}
      HERMES_WEB_HERMES_API_MODEL: openrouter/owl-alpha
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/backend:/app
    ports:
      - "8791:8791"

  frontend:
    image: python:3.12-slim
    working_dir: /app
    command: python -m http.server 8793 --bind 0.0.0.0
    volumes:
      - ./services/frontend:/app
    ports:
      - "8793:8793"
    depends_on:
      - backend
